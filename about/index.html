<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我们 · 嘉能恒业</title>
  <meta name="description" content="关于我们，敬请期待。">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/base.css?v=20261016">
  <style>
    .ph-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-7) var(--sp-5);
      text-align: center;
      background:
        radial-gradient(700px 340px at 50% 0%, rgba(240, 160, 0, 0.10), transparent 62%),
        var(--c-bg-soft);
    }
    .ph-card {
      max-width: 560px;
      width: 100%;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-md);
      padding: var(--sp-8) var(--sp-6);
    }
    .ph-logo {
      height: 44px;
      width: auto;
      margin: 0 auto var(--sp-5);
      display: block;
    }
    .ph-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: var(--r-pill);
      background: var(--c-primary-light);
      color: var(--c-primary-hover);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      margin-bottom: var(--sp-4);
    }
    .ph-title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.4;
      margin: 0 0 var(--sp-3);
      color: var(--c-text);
    }
    .ph-desc {
      font-size: 14px;
      line-height: 1.9;
      color: var(--c-text-soft);
      margin: 0 0 var(--sp-6);
    }
    .ph-divider {
      height: 1px;
      background: var(--c-border);
      margin: var(--sp-6) 0;
    }
    .ph-actions {
      display: flex;
      gap: var(--sp-3);
      justify-content: center;
      flex-wrap: wrap;
    }
    .ph-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 22px;
      border-radius: var(--r-pill);
      font-size: 14px;
      text-decoration: none;
      transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
    }
    .ph-btn--primary {
      background: linear-gradient(135deg, var(--c-accent), var(--c-primary));
      color: #fff;
      box-shadow: var(--shadow-sm);
    }
    .ph-btn--primary:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    .ph-btn--ghost {
      background: transparent;
      color: var(--c-text-soft);
      border: 1px solid var(--c-border-strong);
    }
    .ph-btn--ghost:hover {
      border-color: var(--c-primary);
      color: var(--c-primary);
    }
    .ph-foot {
      margin-top: var(--sp-6);
      font-size: 12px;
      color: var(--c-text-mute);
      line-height: 1.8;
    }
    .ph-foot a { color: var(--c-primary); text-decoration: none; }
    .ph-foot a:hover { text-decoration: underline; }
    .ph-bar {
      height: 3px;
      width: 84px;
      margin: 0 auto var(--sp-6);
      border-radius: var(--r-pill);
      background: linear-gradient(90deg, var(--c-accent), var(--c-primary));
    }
  </style>
</head>
<body>
  <main class="ph-page">
    <div class="ph-card">
      <img class="ph-logo" src="/assets/img/logo.png" alt="嘉能恒业" width="152" height="44">
      <span class="ph-badge">COMING SOON</span>
      <div class="ph-bar"></div>
      <h1 class="ph-title" id="phTitle">关于我们</h1>
      <p class="ph-desc" id="phDesc">这里将介绍公司发展历程、团队构成与企业文化，内容正在撰写中。</p>
      <div class="ph-divider"></div>
      <div class="ph-actions">
        <a class="ph-btn ph-btn--primary" href="../">返回首页</a>
        <a class="ph-btn ph-btn--ghost" href="../contact.html">联系我们</a>
      </div>
      <p class="ph-foot">
        嘉能恒业 · <a href="../">kanerg.com</a>
      </p>
    </div>
  </main>
</body>
</html>
